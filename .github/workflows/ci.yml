name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  control-plane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python scripts
        run: python -m compileall -q scripts
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Test gate extraction
        run: python scripts/agent-gate/extract_aif_gate_result.py --self-test
      - name: Test final gate check
        run: python scripts/agent-gate/final_gate_check.py --self-test
      - name: Validate AI Factory artifacts
        run: python scripts/agent-gate/validate_ai_factory.py --self-test
      - name: Validate Windmill project files
        run: python scripts/windmill/validate_windmill_project.py --self-test
      - name: Test GitHub check payload
        run: python scripts/agent-gate/github_check_payload.py --self-test
      - name: Test GitHub status payload
        run: python scripts/agent-gate/github_status_payload.py --self-test
      - name: Test agent flow harness
        run: python scripts/agent-flow/mil_flow.py --self-test
      - name: Test local agent tool checker
        run: python scripts/agent-flow/check_agent_tools.py --self-test
      - name: Test Augment config checker
        run: python scripts/agent-flow/check_augment_config.py --self-test
      - name: Check shell wrappers
        run: bash -n scripts/agent-flow/auggie_mcp_server.sh scripts/agent-flow/run_codex_with_mil_env.sh scripts/agent-flow/auggie_interactive.sh scripts/windmill/bootstrap_workspace.sh
