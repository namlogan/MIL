name: ci

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled, edited]
  push:
    branches:
      - main

jobs:
  control-plane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python scripts
        run: python -m compileall -q scripts
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Test gate extraction
        run: python scripts/agent-gate/extract_aif_gate_result.py --self-test
      - name: Test final gate check
        run: python scripts/agent-gate/final_gate_check.py --self-test
      - name: Validate AI Factory artifacts
        run: python scripts/agent-gate/validate_ai_factory.py --self-test
      - name: Validate project intake package
        run: python scripts/project-intake/validate_project_intake.py --self-test
      - name: Validate Windmill project files
        run: python scripts/windmill/validate_windmill_project.py --self-test
      - name: Check public webhook endpoint validator
        run: python scripts/windmill/check_public_endpoint.py --self-test
      - name: Check operator dashboard
        run: python scripts/operator/daily_status.py --self-test
      - name: Check branch protection policy evaluator
        run: python scripts/github/check_branch_protection.py --self-test
      - name: Check Mem0 provider preflight
        run: python scripts/agent-memory/check_mem0_provider.py --self-test
      - name: Check Mem0 development library preflight
        run: python scripts/agent-memory/check_mem0_library.py --self-test
      - name: Check Mem0 framework integration smoke
        run: python scripts/agent-memory/mem0_framework_integration.py --self-test
      - name: Check release gate
        run: python scripts/release/release_gate.py --self-test
      - name: Check deploy provider config
        run: python scripts/release/deploy_provider.py --self-test
      - name: Check product CI config
        run: python scripts/product-ci/run_product_checks.py --self-test
      - name: Run configurable product CI
        run: python scripts/product-ci/run_product_checks.py
      - name: Test GitHub check payload
        run: python scripts/agent-gate/github_check_payload.py --self-test
      - name: Test GitHub status payload
        run: python scripts/agent-gate/github_status_payload.py --self-test
      - name: Test agent flow harness
        run: python scripts/agent-flow/mil_flow.py --self-test
      - name: Test AI delivery coordinator
        run: python scripts/agent-flow/delivery_coordinator.py --self-test
      - name: Test local agent tool checker
        run: python scripts/agent-flow/check_agent_tools.py --self-test
      - name: Test Augment config checker
        run: python scripts/agent-flow/check_augment_config.py --self-test
      - name: Check shell wrappers
        run: bash -n scripts/agent-flow/auggie_mcp_server.sh scripts/agent-flow/run_codex_with_mil_env.sh scripts/agent-flow/auggie_interactive.sh scripts/windmill/bootstrap_workspace.sh

  merge-controller-policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Evaluate PR auto-merge policy
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: python scripts/github/merge_controller.py --repo "$REPO" --pr "$PR_NUMBER" --policy-only

  enable-automerge:
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      (
        contains(github.event.pull_request.labels.*.name, 'agent:auto-build') ||
        contains(github.event.pull_request.labels.*.name, 'automerge:candidate') ||
        contains(github.event.pull_request.labels.*.name, 'owner:auto-approve')
      ) &&
      !contains(github.event.pull_request.labels.*.name, 'hold') &&
      !contains(github.event.pull_request.labels.*.name, 'owner-review') &&
      !contains(github.event.pull_request.labels.*.name, 'do-not-merge') &&
      !contains(github.event.pull_request.labels.*.name, 'blocked') &&
      !contains(github.event.pull_request.labels.*.name, 'security-review')
    needs:
      - merge-controller-policy
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable GitHub auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: gh pr merge "$PR_NUMBER" --repo "$REPO" --squash --auto --delete-branch
