summary: MIL plan to PR
description: Dispatch exactly one coding agent and prepare a PR-ready artifact.
lock: '!inline f/mil/plan_to_pr.script.lock'
has_on_behalf_of: false
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    augment_context:
      type: array
      description: Preloaded read-only Augment codebase context.
      default: null
    memory_context:
      type: array
      description: Preloaded scoped Mem0 memory context.
      default: null
    options:
      type: object
      description: Plan-to-PR orchestration options.
      default: null
      properties: {}
    request:
      type: object
      description: Full Plan-to-PR orchestration request.
      default: null
      properties: {}
    task:
      type: object
      description: MIL task payload.
      default: null
      properties: {}
  required: []
