project: MIL
version: 1

language:
  ui: en
  artifacts: en
  technical_terms: keep

source_of_truth:
  issue: GitHub Issue
  pr: GitHub Pull Request
  ci: GitHub Actions
  cockpit: Windmill

paths:
  description: .ai-factory/DESCRIPTION.md
  architecture: .ai-factory/ARCHITECTURE.md
  docs: docs
  roadmap: .ai-factory/ROADMAP.md
  research: .ai-factory/RESEARCH.md
  rules_file: .ai-factory/RULES.md
  plan: .ai-factory/PLAN.md
  plans: .ai-factory/plans
  fix_plan: .ai-factory/FIX_PLAN.md
  security: .ai-factory/SECURITY.md
  references: .ai-factory/references
  patches: .ai-factory/patches
  evolutions: .ai-factory/evolutions
  evolution: .ai-factory/evolution
  specs: .ai-factory/specs
  rules: .ai-factory/rules
  qa: .ai-factory/qa
  archive: .ai-factory/archive
  runtime_agents: .ai-factory/runtime/agents.json
  runtime_workflows: .ai-factory/runtime/workflows.json
  runtime_evidence: .ai-factory/runtime/evidence.json
  runtime_environment: .ai-factory/runtime/environment.json
  gates: .ai-factory/gates
  memory: .ai-factory/memory
  memory_policy: .ai-factory/memory/MEMORY_POLICY.md
  memory_types: .ai-factory/memory/MEMORY_TYPES.yaml
  memory_context_pack_template: .ai-factory/memory/CONTEXT_PACK_TEMPLATE.md
  memory_handoff_template: .ai-factory/memory/HANDOFF_MEMORY_TEMPLATE.md
  memory_event_schema: memory/schemas/memory_event.schema.json
  memory_samples: memory/samples
  memory_tools: memory/tools
  windmill: .windmill
  setup_doc: docs/ai-factory-setup.md
  runtime_bootstrap: scripts/ai-factory/bootstrap_runtime.py
  codex_worker_runner: scripts/agent-flow/codex_worker.py
  windmill_codex_worker: f/mil/codex_worker.py
  windmill_codex_worker_contract: f/mil/codex_worker_contract.py
  project_intake_validator: scripts/project-intake/validate_project_intake.py
  project_prd: docs/project/PRD.md
  project_mvp_scope: docs/project/MVP_SCOPE.md
  project_user_flows: docs/project/USER_FLOWS.md
  project_data_model: docs/project/DATA_MODEL.md
  project_test_strategy: docs/project/TEST_STRATEGY.md
  project_deployment: docs/project/DEPLOYMENT.md
  project_intake_template_prd: docs/templates/project/PRD.md
  operator_dashboard: scripts/operator/daily_status.py
  product_ci_config: .ai-factory/product-ci.json
  product_ci_runner: scripts/product-ci/run_product_checks.py
  release_gate: scripts/release/release_gate.py
  release_template: docs/templates/release/RELEASE_CHECKLIST.md

workflow:
  auto_create_dirs: true
  plan_id_format: slug
  analyze_updates_architecture: true
  architecture_updates_roadmap: true
  verify_mode: strict
  base_branch: main
  branch_prefix: agent/
  fix_branch_prefix: fix/
  max_auto_fix_iterations: 2
  gate_result_block: aif-gate-result
  require_pull_request: true
  require_human_for_release: true
  require_human_for_restricted_changes: true
  require_coding_agent_dispatch: true
  runtime_check_command: python3 scripts/ai-factory/bootstrap_runtime.py --check
  required_status_contexts:
    - control-plane
    - ai-gate/final-review
  project_intake_check_command: python3 scripts/project-intake/validate_project_intake.py
  operator_daily_status_command: python3 scripts/operator/daily_status.py
  product_ci_command: python3 scripts/product-ci/run_product_checks.py
  release_gate_command: python3 scripts/release/release_gate.py --evidence <release-evidence.json>
  mem0_provider_check_command: python3 scripts/agent-memory/check_mem0_provider.py
  branch_protection_check_command: python3 scripts/github/check_branch_protection.py

git:
  enabled: true
  base_branch: main
  create_branches: true
  branch_prefix: agent/
  skip_push_after_commit: true

rules:
  base: .ai-factory/rules/base.md
  implementation: .ai-factory/rules/implementation.md
  quality_gates: .ai-factory/rules/quality-gates.md
  security: .ai-factory/rules/security.md
  memory: .ai-factory/rules/memory.md
  windmill: .ai-factory/rules/windmill.md

agents:
  codex:
    role: implementation_and_test_worker
    allowed_default_actions:
      - plan
      - implement_scoped_issue
      - run_noninteractive_codex_worker
      - create_isolated_worktree
      - generate_tests
      - fix_ci
      - write_pr_evidence
    forbidden_default_actions:
      - merge_main
      - read_production_secrets
      - deploy_production
  augment_context:
    role: codebase_index_and_context_provider
    allowed_default_actions:
      - expose_codebase_index
      - retrieve_code_context
      - summarize_symbols
      - answer_codebase_context_questions
      - provide_codebase_context
    forbidden_default_actions:
      - implement_scoped_issue
      - create_branch
      - open_pr
      - write_pr_evidence
      - final_merge_approval
      - merge_main
      - deploy_production
      - read_production_secrets
  mem0_memory:
    role: sanitized_long_term_agent_memory_layer
    allowed_default_actions:
      - wm_memory_preflight
      - wm_task_context_pack
      - wm_agent_handoff_collect
      - wm_pr_merge_memory_writeback
      - wm_memory_maintenance
      - wm_memory_conflict_review
      - wm_memory_audit_report
      - record_memory_candidates
      - summarize_repeated_patterns
      - provide_memory_context
    forbidden_default_actions:
      - store_secrets
      - store_raw_customer_data
      - store_unredacted_tokens
      - implement_scoped_issue
      - create_branch
      - open_pr
      - final_merge_approval
      - merge_main
      - deploy_production
      - bypass_branch_protection
  auggie:
    role: supervised_advisory_context_reviewer
    allowed_default_actions:
      - validate_plan
      - review_diff
      - diagnose_ci_failure
      - identify_risks
    forbidden_default_actions:
      - final_merge_approval
      - merge_main
      - deploy_production
      - implement_scoped_issue
  windmill:
    role: cockpit_and_orchestrator
    allowed_default_actions:
      - receive_webhook
      - run_agent_worker
      - create_status_check
      - request_human_approval
      - comment_on_issue_or_pr
    forbidden_default_actions:
      - bypass_branch_protection
      - reinterpret_gate_policy

gate:
  allowed_decisions:
    - APPROVE_MERGE
    - REQUEST_CHANGES
    - REJECT
    - BLOCKED_NEEDS_HUMAN
  approval_requires:
    - ci_passed
    - ai_gate_passed
    - scope_satisfied
    - evidence_present
    - restricted_check_clear
